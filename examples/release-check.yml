name: Release check
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python release_check.py "$GITHUB_REF_NAME"
